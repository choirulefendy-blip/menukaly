:root{
  --green:#3b470a; --green-2:#55651a; --green-soft:#e8ebd9;
  --coral:#ff4a4b; --terra:#c86948;
  --ink:#1f211a; --title:#1b2312;
  --paper:#f3f3f0; --paper-2:#ebeae5; --line:#dcdbd3;
  --muted:#6d6f63;
  --panel-w:500px;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--paper-2);font-family:"OS",system-ui,sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}

/* ---------- APP LAYOUT ---------- */
.app{display:grid;grid-template-rows:auto 1fr;height:100vh;height:100dvh}
.topbar{display:flex;align-items:center;gap:10px;padding:10px 16px;background:#fbfbf8;border-bottom:1px solid var(--line);flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto;min-width:0}
.brand img{height:18px;width:auto}
.brand span{font-size:13px;color:var(--muted);white-space:nowrap;padding-left:10px;border-left:1px solid var(--line)}
.save-state{font-size:12px;color:var(--muted);white-space:nowrap;display:flex;align-items:center;gap:6px}
.save-state i{width:7px;height:7px;border-radius:50%;background:#8aa13a;display:inline-block}
.save-state.dirty i{background:#e0a23a}
.btn{display:inline-flex;align-items:center;gap:7px;height:38px;padding:0 14px;border-radius:10px;border:1px solid var(--line);background:#fff;cursor:pointer;font-size:14px;font-weight:600;white-space:nowrap;transition:background .15s,border-color .15s}
.btn:hover{background:#f4f4ef;border-color:#cfcec5}
.btn:focus-visible{outline:2px solid var(--green);outline-offset:2px}
.btn svg{width:17px;height:17px;flex:none}
.btn.primary{background:var(--green);border-color:var(--green);color:#fff}
.btn.primary:hover{background:var(--green-2)}
.btn.ghost{background:transparent;border-color:transparent}
.btn.ghost:hover{background:#efefe9}
.btn[disabled]{opacity:.4;pointer-events:none}
.menu-wrap{position:relative}
.dropdown{position:absolute;right:0;top:44px;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 12px 32px rgba(30,35,10,.14);padding:6px;min-width:250px;z-index:50;display:none}
.dropdown.open{display:block}
.dropdown button{display:flex;width:100%;align-items:center;gap:10px;padding:10px 12px;border:0;background:none;border-radius:8px;cursor:pointer;text-align:left;font-size:14px}
.dropdown button:hover{background:#f2f3ea}
.dropdown button svg{width:17px;height:17px;color:var(--green)}
.dropdown hr{border:0;border-top:1px solid var(--line);margin:6px 4px}
.dropdown .danger{color:#b3261e}
.dropdown .danger svg{color:#b3261e}

.main{display:grid;grid-template-columns:1fr var(--panel-w);min-height:0}
.stage-wrap{position:relative;overflow:hidden;background:var(--paper-2);min-height:0}
.stage-hint{position:absolute;left:16px;bottom:12px;font-size:12px;color:var(--muted);background:rgba(255,255,255,.75);padding:6px 10px;border-radius:8px;pointer-events:none}

/* ---------- PANEL ---------- */
.panel{background:#fbfbf8;border-left:1px solid var(--line);overflow-y:auto;min-height:0;padding:16px 16px 120px}
.panel h3{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:22px 4px 10px;font-weight:700}
.panel h3:first-child{margin-top:4px}
.stats{display:flex;gap:8px;margin-bottom:12px}
.stat{flex:1;background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.stat b{display:block;font-size:22px;line-height:1.1}
.stat small{font-size:12px;color:var(--muted)}
.stat.so b{color:var(--coral)}
.stat.bsx b{color:#c86948}
.stat.fvx b{color:#d39a00}
.stats .stat{padding:9px 9px;min-width:0}
.stats .stat small{white-space:nowrap;font-size:11px}
.search{position:relative;margin-bottom:8px}
.search input{width:100%;height:42px;border-radius:10px;border:1px solid var(--line);background:#fff;padding:0 12px 0 38px;font-size:14px}
.search svg{position:absolute;left:12px;top:12px;width:18px;height:18px;color:var(--muted)}
.quick{display:flex;gap:8px;flex-wrap:wrap}
.quick .btn{height:34px;font-size:13px;padding:0 11px}

.field{display:block;margin-bottom:10px}
.field span{display:block;font-size:12px;color:var(--muted);margin:0 2px 4px;font-weight:600}
.inp{width:100%;height:40px;border:1px solid var(--line);border-radius:9px;background:#fff;padding:0 11px;font-size:14px;transition:border-color .15s,box-shadow .15s}
.inp:focus{outline:none;border-color:var(--green);box-shadow:0 0 0 3px rgba(59,71,10,.14)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}

.range-opt{flex-direction:column;align-items:stretch !important;gap:8px;cursor:default !important}
.range-opt label{display:flex;justify-content:space-between}
.range-opt b{color:var(--green)}
.range-opt input{width:100%;accent-color:#3b470a;height:28px}
.range-opt.dim{opacity:.45}
.loop-sel{height:34px;border:1px solid var(--line);border-radius:8px;background:#fff;padding:0 6px;font-size:13px;font-weight:600}
.opt{display:flex;align-items:center;justify-content:space-between;background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px;font-size:14px;font-weight:600;cursor:pointer}

.cat-card{background:#fff;border:1px solid var(--line);border-radius:14px;margin-bottom:12px;overflow:hidden}
.cat-head{display:flex;align-items:center;gap:6px;padding:10px 10px 10px 12px;background:#f6f6f0;border-bottom:1px solid var(--line)}
.cat-head .inp{height:36px;font-weight:700;color:var(--coral);flex:1;min-width:0}
.cat-head select{height:36px;border:1px solid var(--line);border-radius:9px;background:#fff;padding:0 6px;font-size:13px;font-weight:600}
.ib{width:32px;height:32px;display:inline-grid;place-items:center;border:0;background:transparent;border-radius:8px;cursor:pointer;color:var(--muted);flex:none}
.ib:hover{background:#ecece4;color:var(--ink)}
.ib.del:hover{background:#fde8e6;color:#b3261e}
.ib.fav{color:#c9c7bd}
.ib.fav .fv{width:19px;height:19px;overflow:visible}
.ib.fav:not(.on) .fv path{fill:currentColor;stroke:none}
.ib.fav:hover{color:#e0a800;background:#fff7dc}
.ib.fav.on{background:#3b470a}
.ib.fav.on .fv{filter:drop-shadow(0 0 2px rgba(255,205,0,1)) drop-shadow(0 0 5px rgba(255,170,0,.7))}
.ib.fav.on:hover{background:#4c5a14}
.ib.best{color:#c9c7bd}
.ib.best .bs{width:18px;height:18px}
.ib.best:hover{color:#c86948;background:#f8ece6}
.ib.best.on{color:#fff;background:#c86948}
.ib.best.on:hover{background:#b55a3b}
.ib svg{width:17px;height:17px}
.ib[disabled]{opacity:.25;pointer-events:none}

.it{display:grid;grid-template-columns:auto 1fr 72px auto;grid-template-areas:"sw nm pr ac" "sw tg tg tg";align-items:center;gap:6px 8px;padding:9px 8px 9px 10px;border-bottom:1px solid #efeee8;transition:background .15s}
.it:last-of-type{border-bottom:0}
.it .inp{height:36px;font-size:13.5px;padding:0 9px}
.it .sw-lbl{grid-area:sw}.it .nm{grid-area:nm}.it .price{grid-area:pr}.it .it-tools{grid-area:tl}
.it-tools .mv{display:flex;flex-direction:column}
.it-tools .mv .ib{width:26px;height:18px;border-radius:5px}
.it-tools .mv .ib svg{width:15px;height:15px}
.it .price{text-align:right;font-weight:700}
.it.sold{background:#fff4f2}
.it.sold .nm{color:#8a7d78;text-decoration:line-through;text-decoration-color:rgba(255,74,75,.5)}
.it.sold .price{color:#b9aaa5}
.it-tools{display:contents}
.it-tools .tags{grid-area:tg;display:flex;align-items:center;gap:4px;flex-wrap:wrap}
.it-tools .acts{grid-area:ac;display:flex;align-items:center;gap:2px}
.tg{display:inline-flex;align-items:center;gap:4px;height:30px;padding:0 8px 0 7px;border-radius:99px;border:1px solid var(--line);background:#fff;color:#9a9a8f;font-size:12px;font-weight:700;cursor:pointer}
.tg svg{width:16px;height:16px;flex:none;overflow:visible}
.tg:not(.on) .fv path{fill:currentColor;stroke:none}
.tg:not(.on) .ti{color:currentColor}
.tg:hover{border-color:#cfcec5;color:var(--ink)}
.tg.fav.on{background:#3b470a;border-color:#3b470a;color:#ffe27a}
.tg.fav.on .fv{filter:drop-shadow(0 0 2px rgba(255,205,0,1)) drop-shadow(0 0 4px rgba(255,170,0,.7))}
.tg.best.on{background:#3b470a;border-color:#3b470a;color:#ffe27a}
.tg.best.on .bs path{fill:url(#kalyGold);stroke:#c98a00;stroke-width:.8px}
.tg.best.on .bs{overflow:visible;filter:drop-shadow(0 0 2px rgba(255,205,0,1)) drop-shadow(0 0 4px rgba(255,170,0,.7))}
.tg.ice.on{background:#e3f1fc;border-color:#2f8fd8;color:#1f6fb0}
.tg.ice.on .ti{color:#2f8fd8}
.tg.hot.on{background:#fdeae4;border-color:#e0502e;color:#b8391b}
.tg.hot.on .ti{color:#e0502e}
.tg .cl{width:15px;height:15px;margin-left:-5px}
.tg .cl:first-child{margin-left:0}
.tg.spicy:not(.on) .cl path:first-child{fill:currentColor}
.tg.spicy:not(.on) .cl path:last-child{stroke:currentColor}
.tg.spicy.on{background:#fde6e3;border-color:#d23a2a;color:#b3261e}
.it.hide{display:none}
.add-it{display:flex;width:100%;align-items:center;justify-content:center;gap:6px;padding:11px;border:0;border-top:1px dashed var(--line);background:#fcfcf9;color:var(--green);font-weight:700;font-size:13px;cursor:pointer}
.add-it:hover{background:var(--green-soft)}
.add-it svg{width:16px;height:16px}
.add-cat{width:100%;justify-content:center;height:46px;border-style:dashed;color:var(--green)}

/* switch */
.sw{position:relative;width:50px;height:28px;flex:none;cursor:pointer;border:0;padding:0;background:none}
.sw .track{position:absolute;inset:0;border-radius:99px;background:var(--coral);transition:background .2s}
.sw .knob{position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .2s}
.sw[aria-checked="true"] .track{background:var(--green)}
.sw[aria-checked="true"] .knob{transform:translateX(22px)}
.sw:focus-visible{outline:2px solid var(--green);outline-offset:2px;border-radius:99px}
.sw-lbl{display:flex;flex-direction:column;align-items:center;gap:2px}
.sw-lbl small{font-size:9.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--green)}
.it.sold .sw-lbl small{color:var(--coral)}

.stage::after{content:"";position:absolute;top:0;left:0;right:0;bottom:0;pointer-events:none;
  background:radial-gradient(ellipse at 50% 45%,rgba(255,255,255,.35),rgba(255,255,255,0) 60%),radial-gradient(ellipse at 50% 50%,transparent 70%,rgba(120,118,100,.06))}
.s-head{position:absolute;left:120px;right:120px;top:60px;height:110px;display:flex;align-items:center;justify-content:space-between;z-index:1}
.s-title{display:flex;align-items:baseline;margin:0;line-height:1;white-space:nowrap}
.s-trial{font-family:"Hand",cursive;font-weight:400;font-size:76px;color:var(--coral);letter-spacing:1px;display:inline-block;transform:translateY(4px);margin-right:4px}
.s-main{font-weight:700;font-size:60px;color:var(--title);letter-spacing:-1.2px}
.s-logo{width:362px;height:auto;display:block;margin-top:6px}

.s-cols{--s:1;position:absolute;left:120px;right:120px;top:180px;display:flex;align-items:flex-start;z-index:1}
.s-col{flex:1 1 auto;min-width:0}
.s-col + .s-col{margin-left:80px}
.s-cols.measure .s-col{flex:none}
.s-item .n{white-space:nowrap}
.s-cat + .s-cat{margin-top:calc(42px * var(--s))}
.s-cat h2{margin:0 0 calc(14px * var(--s));font-weight:700;font-size:calc(53px * var(--s));line-height:1.12;color:var(--coral);letter-spacing:-.2px}
.s-item{display:flex;align-items:baseline;font-size:calc(27px * var(--s));line-height:1.4;position:relative}
.s-item .n{flex:1;min-width:0;letter-spacing:.15px}
.s-item .p{font-weight:700;text-align:right;min-width:1.4em;white-space:nowrap;margin-left:auto;padding-left:calc(18px * var(--s))}
.s-item .n{flex:0 1 auto}
.s-item .bs{flex:none;width:1em;height:1em;margin-left:.38em;color:var(--terra,#c86948);align-self:center;transform:translateY(-.04em)}
.s-item.sold .bs{opacity:.42}
.s-item .bs path,.s-legend .bs path{fill:url(#kalyGold);stroke:#c98a00;stroke-width:.8px;stroke-linejoin:round}
.s-item .bs{overflow:visible;filter:drop-shadow(0 0 .06em rgba(255,190,0,.95)) drop-shadow(0 0 .22em rgba(255,170,0,.55))}
.s-legend .bs{overflow:visible;filter:drop-shadow(0 0 2px rgba(255,190,0,.9)) drop-shadow(0 0 6px rgba(255,170,0,.5))}
.anim .s-item .bs,.anim .s-legend .bs{animation:starGlow 1.8s ease-in-out infinite alternate}
.s-item.sold .bs{animation:none;filter:none}
.s-brand{position:relative;display:block}
.s-legend{position:absolute;left:0;right:0;bottom:16px;display:flex;justify-content:center;align-items:center;font-weight:600;font-size:22px;color:#6d6f63;white-space:nowrap;z-index:2}
.s-legend .bs{width:22px;height:22px;margin-right:7px}
.s-legend .ti{width:22px;height:22px;margin-right:6px}
.s-item .fv{flex:none;width:1.06em;height:1.06em;margin-left:.36em;align-self:center;transform:translateY(-.05em);overflow:visible;filter:drop-shadow(0 0 .06em rgba(255,190,0,.95)) drop-shadow(0 0 .22em rgba(255,170,0,.55))}
.s-item .fv + .bs{margin-left:.28em}
.anim .s-item .fv,.anim .s-legend .fv{animation:starGlow 1.8s ease-in-out infinite alternate}
@keyframes starGlow{from{filter:drop-shadow(0 0 .04em rgba(255,190,0,.8)) drop-shadow(0 0 .1em rgba(255,170,0,.3))}to{filter:drop-shadow(0 0 .1em rgba(255,216,70,1)) drop-shadow(0 0 .4em rgba(255,170,0,.8))}}
.s-item.sold .fv{opacity:.45;animation:none;filter:none}
.s-legend .lg{display:flex;align-items:center}
.s-legend .lg + .lg{margin-left:34px}
.s-legend .lgf{color:#b07a00}
.s-item .ti{flex:none;width:.92em;height:.92em;margin-left:.3em;align-self:center;transform:translateY(-.04em)}
.ti.ice{color:#2f8fd8}
.ti.hot{color:#e0502e}
.s-item.sold .ti{opacity:.42}
.s-legend .lg{color:#b07a00}
.s-legend .lgi{color:#2f8fd8}
.s-legend .lgh{color:#e0502e}
.s-item .spc{flex:none;display:inline-flex;align-items:center;margin-left:auto;padding-left:calc(14px * var(--s));align-self:center;transform:translateY(-.04em)}
.s-item .spc + .p{margin-left:0;padding-left:.28em}
.s-item .spc .cl{width:1em;height:1em;margin-left:-.16em}
.s-item .spc .cl:first-child{margin-left:0}
.s-item.sold .spc{opacity:.42}
.s-legend .lgs{color:#d23a2a}
.s-legend .cl{width:24px;height:24px;margin-right:5px}
.s-legend .fv{width:25px;height:25px;margin-right:7px;overflow:visible;filter:drop-shadow(0 0 2px rgba(255,190,0,.9)) drop-shadow(0 0 6px rgba(255,170,0,.5))}
.s-item.sold .n{opacity:.42}
.s-item .so{font-weight:700;color:var(--coral);text-transform:uppercase;font-size:.6em;letter-spacing:.07em;white-space:nowrap;border:2px solid var(--coral);border-radius:6px;padding:0 .4em;line-height:1.55;transform:translateY(-.18em);display:inline-block}

.s-icons{position:absolute;left:50%;bottom:56px;height:206px;width:1464px;margin-left:-732px;display:flex;justify-content:space-between;z-index:1}
.s-icons.off{display:none}
.tile{width:218px;height:206px;display:flex;align-items:center;justify-content:center}
.tile img{display:block;transform-origin:50% 70%}
.anim .tile img{animation:boil .8s steps(1) infinite}
.anim .tile:nth-child(2) img{animation-delay:-.2s}
.anim .tile:nth-child(3) img{animation-delay:-.5s}
.anim .tile:nth-child(4) img{animation-delay:-.3s}
.anim .tile:nth-child(5) img{animation-delay:-.6s}
.anim .tile:nth-child(6) img{animation-delay:-.1s}
@keyframes boil{
  0%{transform:rotate(-2.2deg) translate(-2px,1px)}
  25%{transform:rotate(1.6deg) translate(2px,-2px)}
  50%{transform:rotate(-.8deg) translate(-1px,-1px)}
  75%{transform:rotate(2.4deg) translate(1px,2px)}
}

/* intro animation (display mode) */
.ch{display:inline-block;white-space:pre}
.intro .s-trial{animation:write 1.1s cubic-bezier(.5,0,.3,1) both}
.intro .ch{animation:blurIn .9s ease-out both}
@keyframes write{from{clip-path:inset(-30px 100% -30px -30px)}to{clip-path:inset(-30px -40px -30px -30px)}}
@keyframes blurIn{from{opacity:0;filter:blur(14px)}to{opacity:1;filter:blur(0)}}
.s-title.out{animation:titleOut .7s ease-in both}
@keyframes titleOut{to{opacity:0;filter:blur(12px)}}

/* STAGE-CSS-END */
/* edit affordances on stage */
.editing [data-bind]{outline:2px dashed transparent;outline-offset:3px;border-radius:4px;cursor:text;transition:outline-color .15s,background .15s}
.editing [data-bind]:hover{outline-color:rgba(59,71,10,.35)}
.editing [data-bind]:focus{outline:3px solid var(--green);background:rgba(255,255,255,.7)}
.editing .s-item .so{cursor:pointer}

/* ---------- DISPLAY MODE ---------- */
body.display .topbar,body.display .panel,body.display .stage-hint{display:none}
body.display .main{grid-template-columns:1fr}
body.display .app{grid-template-rows:1fr}
body.display .stage-wrap{background:#e6e5df}
body.display .stage{box-shadow:none}
body.display.idle{cursor:none}
.fab{position:fixed;right:18px;bottom:18px;display:none;gap:8px;z-index:60;transition:opacity .4s}
body.display .fab{display:flex}
body.display.idle .fab{opacity:0;pointer-events:none}
.fab .btn{box-shadow:0 6px 20px rgba(0,0,0,.15)}

/* ---------- TOAST / MODAL ---------- */
.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,30px);opacity:0;background:#1f2410;color:#fff;border-radius:12px;padding:10px 10px 10px 16px;display:flex;align-items:center;gap:14px;font-size:14px;z-index:90;transition:all .25s;pointer-events:none;max-width:calc(100vw - 32px)}
.toast.show{transform:translate(-50%,0);opacity:1;pointer-events:auto}
.toast button{background:rgba(255,255,255,.14);border:0;color:#fff;border-radius:8px;padding:7px 12px;font-weight:700;cursor:pointer}
.modal-bg{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(20,24,8,.4);display:none;place-items:center;z-index:100;padding:16px}
.modal-bg.open{display:grid}
.modal{background:#fff;border-radius:16px;padding:22px;max-width:400px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,.25)}
.modal h4{margin:0 0 8px;font-size:18px}
.modal p{margin:0 0 18px;color:var(--muted);font-size:14px;line-height:1.5}
.modal .acts{display:flex;justify-content:flex-end;gap:8px}
.btn.danger{background:#b3261e;border-color:#b3261e;color:#fff}

/* ---------- TABS + SLIDESHOW ---------- */
.tabs{display:inline-flex;background:#efefe8;border-radius:11px;padding:3px;margin-left:12px}
.tabs button{border:0;background:transparent;height:32px;padding:0 14px;border-radius:9px;font-weight:700;font-size:14px;color:var(--muted);cursor:pointer}
.tabs button.on{background:#fff;color:var(--green);box-shadow:0 1px 3px rgba(0,0,0,.1)}
body.tab-slides .main,body.tab-slides #undoBtn,body.tab-slides #popBtn,body.tab-slides #displayBtn{display:none}
.sv{display:none;grid-template-columns:1fr var(--panel-w);min-height:0}
body.tab-slides .sv{display:grid}
body.display .sv{display:none}
.sv-prev{background:#1d2014;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;gap:12px;min-height:0}
.sv-frame{width:100%;max-width:1100px;aspect-ratio:16/9;background:#000;border-radius:10px;overflow:hidden;box-shadow:0 12px 40px rgba(0,0,0,.35)}
.sv-frame iframe{width:100%;height:100%;border:0;display:block}
.sv-cap{color:#b9bca9;font-size:13px}
.sl-warn{background:#fff4e5;border:1px solid #f1c27d;color:#7a4b00;border-radius:12px;padding:12px 14px;font-size:13.5px;line-height:1.5;margin-bottom:8px}
.sl-row{display:flex;gap:8px;align-items:center;margin-bottom:10px}
.sl-row .inp{flex:1;min-width:0}
.sl-row .btn{height:40px}
.sl-link{background:var(--green-soft);border:1px solid #d5dabd;border-radius:12px;padding:10px 10px 10px 14px;display:flex;align-items:center;gap:8px;margin:4px 0 6px}
.sl-link div{flex:1;min-width:0}
.sl-link small{display:block;font-size:10.5px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.06em}
.sl-link b{display:block;font-size:14px;color:var(--green);word-break:break-all}
.sl-link .btn{height:34px;font-size:13px;padding:0 11px}
.sl-drop{display:flex;flex-direction:column;align-items:center;gap:3px;border:2px dashed #c9cdb0;border-radius:14px;padding:16px;text-align:center;background:#fff;cursor:pointer;color:var(--green);font-weight:700;font-size:15px}
.sl-drop svg{width:22px;height:22px}
.sl-drop small{color:var(--muted);font-weight:400;font-size:12px}
.sl-drop.over,.sl-drop:hover{background:var(--green-soft);border-color:var(--green)}
.sl-prog{font-size:12.5px;margin:8px 2px;color:var(--muted)}
.sl-prog .bar{height:6px;background:#e7e7df;border-radius:4px;overflow:hidden;margin-top:4px}
.sl-prog .bar i{display:block;height:100%;width:0;background:var(--green);transition:width .2s}
.sl-prog.bad{color:#b3261e}.sl-prog.bad .bar i{background:#d33}
.sl-empty{color:var(--muted);font-size:14px;text-align:center;margin:18px 0}
.sl-it{display:grid;grid-template-columns:104px 1fr auto;gap:10px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:12px;padding:8px;margin-top:8px}
.sl-it.off{opacity:.5}
.sl-it .th{position:relative;width:104px;aspect-ratio:16/9;border-radius:8px;overflow:hidden;background:#222}
.sl-it .th img,.sl-it .th video{width:100%;height:100%;object-fit:cover;display:block}
.sl-it .num{position:absolute;top:4px;left:4px;background:#fff;color:var(--ink);font-size:10.5px;font-weight:700;border-radius:5px;padding:0 5px}
.sl-it .tag{position:absolute;left:4px;bottom:4px;background:rgba(0,0,0,.65);color:#fff;font-size:9.5px;font-weight:700;letter-spacing:.04em;padding:1px 5px;border-radius:4px}
.sl-meta{min-width:0}
.sl-meta .inp{height:34px;font-size:13.5px;margin-bottom:6px;padding:0 9px}
.sl-dur{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--muted);flex-wrap:wrap}
.sl-dur .inp{width:66px;height:32px;margin:0;text-align:center;font-weight:700}
.sl-dur em{font-style:normal;font-size:11.5px}
.sl-tools{display:flex;flex-direction:column;align-items:center;gap:4px}
.sl-tools .mv{display:flex}

.outdated{position:fixed;left:0;right:0;top:0;z-index:300;background:#b3261e;color:#fff;padding:12px 16px;font-weight:700;font-size:14px;display:flex;gap:12px;align-items:center;justify-content:center;flex-wrap:wrap}
.outdated button{background:#fff;color:#b3261e;border:0;border-radius:8px;padding:7px 12px;font-weight:700;cursor:pointer}
/* ---------- STATUS / PIN GATE ---------- */

.save-state.err{color:#b3261e}

.gate.hidden{display:none}
.gate-card{width:100%;max-width:360px;text-align:center}
.gate-card img{width:220px;max-width:70%;margin:0 auto 6px;display:block}
.gate-card .sub{color:var(--muted);font-size:14px;margin:0 0 22px}
.dots{display:flex;justify-content:center;gap:14px;margin:0 0 10px;height:18px}
.dots i{width:16px;height:16px;border-radius:50%;border:2px solid var(--green);display:block;transition:background .1s}
.dots i.on{background:var(--green)}
.gate-msg{min-height:22px;font-size:14px;color:#b3261e;font-weight:600;margin-bottom:10px}
.keys{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.keys button{height:66px;border-radius:16px;border:1px solid var(--line);background:#fff;font-size:26px;font-weight:600;cursor:pointer;transition:background .1s,transform .05s}
.keys button:active{background:var(--green-soft);transform:scale(.97)}
.keys .k-alt{font-size:15px;color:var(--muted)}
.keys .k-ok{background:var(--green);color:#fff;border-color:var(--green);font-size:17px}
.keys .k-ok:active{background:var(--green-2)}
.shake{animation:shake .35s}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.pin-form .inp{margin-bottom:10px;text-align:center;font-size:20px;letter-spacing:.3em;height:48px}
.pin-form .modal-err{color:#b3261e;font-size:13px;font-weight:600;min-height:18px;margin:-4px 0 12px}

/* ---------- RESPONSIVE ---------- */
@media (max-width:1000px){
  .app{height:auto;min-height:100vh}
  .main{grid-template-columns:1fr}
  .stage-wrap{aspect-ratio:16/9;width:100%;position:sticky;top:0;z-index:5;border-bottom:1px solid var(--line)}
  .panel{border-left:0;overflow:visible;padding-bottom:80px}
  .stage-hint{display:none}
  .btn .lbl{display:none}
  .btn.primary .lbl{display:inline}
  .brand span{display:none}
  .it{grid-template-columns:auto 1fr 84px auto;grid-template-areas:"sw nm pr ac" "sw tg tg tg";row-gap:8px;padding:10px 8px 10px 12px}
  .it .inp{font-size:15px;height:40px}
  body.display .app{height:100vh;height:100dvh}
  body.display .stage-wrap{aspect-ratio:auto;position:relative;height:100%}
  .sv{grid-template-columns:1fr}
  .sv-prev{padding:10px}
  .sv-frame{max-width:640px}
  .sv-cap{display:none}
}
@media (max-width:480px){
  .topbar{padding:8px 10px;gap:6px}
  .btn{padding:0 10px}
  .save-state{display:none}
  #popBtn{display:none}
  .brand img{height:14px}
  .tabs{margin-left:6px}
  .tabs button{padding:0 10px;font-size:13px}
}
</style>

function normalize(d){

  d.showIcons = d.showIcons !== false; d.animate = d.animate !== false;
  d.iconScale = Math.min(1.25, Math.max(0.5, +d.iconScale || 1));
  d.titleLoop = d.titleLoop == null ? 10 : ([0,10,20,30,60].indexOf(+d.titleLoop) > -1 ? +d.titleLoop : 10);
  d.categories = (d.categories || []).map(c => Object.assign({}, c, { id:c.id||uid(), name:c.name||"", col:[1,2,3,4].includes(+c.col)?+c.col:1,
    items:(c.items||[]).map(it => Object.assign({}, it, { id:it.id||uid(), name:it.name||"", price:String(it.price??""), available:it.available!==false, best:!!it.best, fav:!!it.fav, ice:!!it.ice, hot:!!it.hot, spicy:Math.min(3, Math.max(0, Math.round(+it.spicy || 0))) })) }));
  if (d.bestLabel == null) d.bestLabel = "Best Seller";
  if (d.favLabel == null || d.favLabel === "Favourite") d.favLabel = "Our Favourite";
  if (d.iceLabel == null) d.iceLabel = "Ice";
  if (d.hotLabel == null) d.hotLabel = "Hot";
  if (d.spicyLabel == null) d.spicyLabel = "Spicy";
  /* one-time move to the 4-column layout: each category gets its own column, in order */
  if (d.layout !== 4){ d.categories.forEach((c, i) => c.col = Math.min(i + 1, 4)); d.layout = 4; d._migrated = true; }
  return d;
}

}

let pin = lsGet(PINKEY) || "";

/* Several admin devices can edit at once (iPad kasir, HP, laptop). Each save is merged with
   whatever another device saved in the meantime, field by field, so nobody's changes are lost. */
const APP_VERSION = 7;
let base = null, outdated = false;
const same = (a, b) => JSON.stringify(a) === JSON.stringify(b);
function mergeList(B, L, R, mergeOne){
  B = B || []; L = L || []; R = R || [];
  const ids = a => a.map(x => x.id);
  const bm = new Map(B.map(x => [x.id, x])), lm = new Map(L.map(x => [x.id, x])), rm = new Map(R.map(x => [x.id, x]));
  const common = (a, b) => a.filter(i => b.includes(i));
  const localReordered = !same(common(ids(L), ids(B)), common(ids(B), ids(L)));
  const order = (localReordered ? ids(L) : ids(R)).concat(ids(R), ids(L)).filter((id, i, arr) => arr.indexOf(id) === i);
  return order.filter(id => !(bm.has(id) && (!lm.has(id) || !rm.has(id))))      /* deleted on either side */
    .map(id => { const l = lm.get(id), r = rm.get(id); return l && r ? mergeOne(bm.get(id), l, r) : (l || r); });
}
function mergeObj(b, l, r, skip){
  const out = {}, pick = k => (b && !same(l[k], b[k])) || (!b && l[k] !== undefined) ? l[k] : r[k];
  new Set(Object.keys(r).concat(Object.keys(l))).forEach(k => { if (k !== skip) out[k] = pick(k); });
  return out;
}
function merge3(b, l, r){
  if (!b) return r;
  const out = mergeObj(b, l, r, "categories");
  out.categories = mergeList(b.categories, l.categories, r.categories, (bc, lc, rc) => {
    const c = mergeObj(bc, lc, rc, "items");
    c.items = mergeList(bc && bc.items, lc.items, rc.items, (bi, li, ri) => mergeObj(bi, li, ri));
    return c;
  });

}
function checkVersion(d){
  if (d && (+d.appVersion || 0) > APP_VERSION && !outdated){
    outdated = true;

    bar.innerHTML = `Halaman admin ini versi lama — perubahan tidak disimpan. <button type="button">Muat ulang sekarang</button>`;
    bar.querySelector("button").onclick = () => location.reload();
    document.body.appendChild(bar);
  }
  return outdated;
}
const LS_STATUS = { load:["dirty","Memuat…"], pending:["dirty","Menyimpan…"], ok:["","Tersimpan · TV terupdate"], err:["err","Gagal simpan — mencoba lagi…"], off:["err","Offline — data lokal"] };
function setStatus(k){
  const el = $("#saveState"); const [cls, txt] = LS_STATUS[k];
  el.className = "save-state " + cls; el.querySelector("span").textContent = txt;
}
async function api(path, opts = {}){
  const r = await fetch(SUPA_URL + path, Object.assign({}, opts, { headers: Object.assign({ apikey: SUPA_KEY, "Content-Type": "application/json" }, opts.headers || {}) }));
  const t = await r.text(); let j = null; try { j = t ? JSON.parse(t) : null; } catch(e){}
  if (!r.ok){ const e = new Error((j && (j.hint || j.message)) || ("HTTP " + r.status)); e.code = j && j.message; e.pg = j && j.code; throw e; }
  return j;
}
const rpc = (fn, body) => api("/rest/v1/rpc/" + fn, { method:"POST", body: JSON.stringify(body) });
const fetchMeta = () => api("/rest/v1/kaly_menu_state?id=eq.main&select=updated_at").then(r => r && r[0] ? r[0].updated_at : null);
const fetchRow = () => api("/rest/v1/kaly_menu_state?id=eq.main&select=data,updated_at").then(r => r && r[0] ? r[0] : null);

function save(now){
  state.rev = Date.now();
  lsSet(KEY, JSON.stringify(state));
  dirty = true; setStatus("pending");
  clearTimeout(saveTimer); saveTimer = setTimeout(flush, now ? 0 : 600);
}
async function flush(){
  if (!pin || !started || outdated) return;
  if (saving){ clearTimeout(saveTimer); saveTimer = setTimeout(flush, 300); return; }
  if (!dirty) return;
  saving = true; dirty = false;
  try {
    /* someone else saved since our last sync? merge their changes in before writing */
    const cur = await fetchMeta();
    if (cur && cur !== remoteTs){
      const row = await fetchRow();
      if (row){
        if (checkVersion(row.data)){ saving = false; dirty = true; return; }
        state = normalize(merge3(base ? JSON.parse(base) : null, state, normalize(row.data)));
        remoteTs = row.updated_at;
        if (editingBind) renderStage(); else renderAll();
      }
    }
    state.appVersion = APP_VERSION;
    const body = JSON.parse(JSON.stringify(state));
    const ts = await rpc("kaly_menu_save", { p_pin: pin, p_data: body });
    if (ts === null){ dirty = true; saving = false; lock("PIN sudah diganti. Masukkan PIN yang baru."); return; }
    remoteTs = ts; base = JSON.stringify(body); lsSet(KEY, JSON.stringify(state));
    setStatus(dirty ? "pending" : "ok");
  } catch(e){
    dirty = true; setStatus(navigator.onLine === false ? "off" : "err");
    if (e.code === "LOCKED"){ saving = false; lock("Terlalu banyak PIN salah. Coba lagi 10 menit lagi."); return; }
    clearTimeout(saveTimer); saveTimer = setTimeout(flush, 5000);
  }

  if (dirty){ clearTimeout(saveTimer); saveTimer = setTimeout(flush, 600); }
}
async function pullRemote(force){
  if (!started || dirty || saving || (editingBind && !force)) return;
  try {
    const ts = await fetchMeta();
    if (ts === null){ save(true); return; }
    if (!force && ts === remoteTs) { setStatus("ok"); return; }
    const row = await fetchRow();
    if (!row || dirty || saving) return;
    checkVersion(row.data);
    state = normalize(row.data); remoteTs = row.updated_at; base = JSON.stringify(state);
    lsSet(KEY, JSON.stringify(state));
    renderAll(); setStatus("ok");
    if (state._migrated){ delete state._migrated; save(true); }
  } catch(e){ setStatus(navigator.onLine === false ? "off" : "err"); }
}
window.addEventListener("online", () => { if (dirty) flush(); else pullRemote(); });

const findItem = id => { for (const c of state.categories){ const i = c.items.findIndex(x => x.id === id); if (i > -1) return {cat:c, idx:i, item:c.items[i]}; } return null; };
const findCat = id => state.categories.find(c => c.id === id);

function getField(bind){
  const [t, id, f] = bind.split(":");
  if (t === "meta") return state[id];
  if (t === "cat") return findCat(id)?.[f];
  if (t === "item") return findItem(id)?.item[f];
}
function setField(bind, val){
  const [t, id, f] = bind.split(":");
  if (t === "meta") state[id] = val;
  else if (t === "cat") { const c = findCat(id); if (c) c[f] = val; }
  else if (t === "item") { const r = findItem(id); if (r) r.item[f] = val; }
  save();
}

    `<div class="opt" data-act="anim">Animasi (ikon bergerak &amp; judul) <button class="sw" role="switch" aria-checked="${state.animate}" tabindex="-1"><span class="track"></span><span class="knob"></span></button></div>`;
  panel.innerHTML = h;
}

/* ---------- actions ---------- */
function act(a, id, el){
  switch(a){
    case "toggle": { const r = findItem(id); if (!r) return; snapshot(); r.item.available = !r.item.available; save(); renderAll();
      toast(`${r.item.name} → ${r.item.available ? "Tersedia" : state.soldOutLabel}`); break; }
    case "all-on": snapshot(); state.categories.forEach(c => c.items.forEach(i => i.available = true)); save(); renderAll(); toast("Semua menu tersedia"); break;
    case "spicy": { const r = findItem(id); if (!r) return; snapshot(); r.item.spicy = ((r.item.spicy || 0) + 1) % 4; save(); renderAll();
      toast(r.item.spicy ? `🌶️ ${r.item.name} → pedas level ${r.item.spicy}` : `${r.item.name}: tidak pedas`); break; }
    case "ice": case "hot": { const r = findItem(id); if (!r) return; snapshot(); r.item[a] = !r.item[a]; save(); renderAll();
      const t = [r.item.ice && state.iceLabel, r.item.hot && state.hotLabel].filter(Boolean).join(" & ");
      toast(t ? `${r.item.name} → ${t}` : `${r.item.name}: tanpa keterangan Ice/Hot`); break; }
    case "fav": { const r = findItem(id); if (!r) return; snapshot(); r.item.fav = !r.item.fav; save(); renderAll();
      toast(r.item.fav ? `⭐ ${r.item.name} → ${state.favLabel}` : `${r.item.name} bukan ${state.favLabel} lagi`); break; }
    case "best": { const r = findItem(id); if (!r) return; snapshot(); r.item.best = !r.item.best; save(); renderAll();
      toast(r.item.best ? `👍 ${r.item.name} → ${state.bestLabel}` : `${r.item.name} bukan ${state.bestLabel} lagi`); break; }
    case "up": case "down": { const r = findItem(id); if (!r) return; const j = r.idx + (a==="up"?-1:1); if (j<0||j>=r.cat.items.length) return;
      snapshot(); [r.cat.items[r.idx], r.cat.items[j]] = [r.cat.items[j], r.cat.items[r.idx]]; save(); renderAll(); break; }
    case "del": { const r = findItem(id); if (!r) return; snapshot(); r.cat.items.splice(r.idx,1); save(); renderAll(); toast(`"${r.item.name}" dihapus`, true); break; }
    case "add": { const c = findCat(id); if (!c) return; snapshot(); const it = {id:uid(), name:"Menu baru", price:"0", available:true}; c.items.push(it); save(); renderAll();
      const inp = panel.querySelector(`[data-bind="item:${it.id}:name"]`); if (inp){ inp.focus(); inp.select(); } break; }
    case "cat-up": case "cat-down": { const i = state.categories.findIndex(c => c.id===id); const j = i + (a==="cat-up"?-1:1); if (j<0||j>=state.categories.length) return;
      snapshot(); [state.categories[i], state.categories[j]] = [state.categories[j], state.categories[i]]; save(); renderAll(); break; }
    case "cat-del": { const c = findCat(id); if (!c) return;
      confirmBox("Hapus kategori?", `Kategori "${c.name}" beserta ${c.items.length} menunya akan dihapus. Masih bisa di-Undo.`).then(ok => { if (!ok) return;
        snapshot(); state.categories = state.categories.filter(x => x.id!==id); save(); renderAll(); toast(`Kategori "${c.name}" dihapus`, true); }); break; }
    case "cat-add": { snapshot(); const counts = [1,2,3,4].map(n => state.categories.filter(c=>c.col===n).reduce((s,c)=>s+c.items.length+2,0));
      const col = counts.indexOf(Math.min(...counts)) + 1;
      const c = {id:uid(), name:"Kategori Baru", col, items:[{id:uid(), name:"Menu baru", price:"0", available:true}]}; state.categories.push(c); save(); renderAll();
      const inp = panel.querySelector(`[data-bind="cat:${c.id}:name"]`); if (inp){ inp.scrollIntoView({block:"center"}); inp.focus(); inp.select(); } break; }
    case "icons": snapshot(); state.showIcons = !state.showIcons; save(); renderAll(); break;
    case "anim": snapshot(); state.animate = !state.animate; save(); renderAll(); break;
    case "sync": pullRemote(true).then(() => toast("Data dimuat ulang dari server")); break;
    case "change-pin": openPinModal(); break;
    case "logout": lsSet(PINKEY, ""); pin = ""; lock(""); break;
    case "export-json": download(`kaly-menu-backup-${stamp()}.json`, JSON.stringify(state, null, 2), "application/json"); toast("Backup diunduh"); break;
    case "import-json": $("#fileIn").click(); break;
    case "reset": confirmBox("Kembalikan ke menu awal?", "Semua perubahan akan diganti dengan menu bawaan file ini. Masih bisa di-Undo selama halaman belum ditutup.").then(ok => { if (!ok) return;
      snapshot(); state = normalize(clone(DEFAULT)); save(true); renderAll(); toast("Menu dikembalikan ke awal", true); }); break;
  }
}

const stamp = () => { const d = new Date(), p = n => String(n).padStart(2,"0"); return `${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}-${p(d.getHours())}${p(d.getMinutes())}`; };
function download(name, text, type){

  a.href = URL.createObjectURL(new Blob([text], {type}));
  a.download = name; document.body.appendChild(a); a.click();

/* tag file: { kalyTagPatch:1, reset:["best","fav",...], items:{ "Nama Menu": { fav:true, ... } } } */
function applyTagPatch(p){
  const key = s => String(s || "").toLowerCase().replace(/\s+/g, " ").trim();
  const want = new Map(Object.entries(p.items || {}).map(([n, v]) => [key(n), v]));
  const reset = Array.isArray(p.reset) ? p.reset.filter(k => ["best","fav","ice","hot","spicy"].includes(k)) : [];
  snapshot();
  let hit = 0;
  state.categories.forEach(c => c.items.forEach(it => {
    reset.forEach(k => { it[k] = k === "spicy" ? 0 : false; });
    const v = want.get(key(it.name));
    if (v){ hit++; ["best","fav","ice","hot"].forEach(k => { if (k in v) it[k] = !!v[k]; }); if ("spicy" in v) it.spicy = Math.min(3, Math.max(0, +v.spicy || 0)); want.delete(key(it.name)); }
  }));
  save(true); renderAll();
  const miss = [...want.keys()];
  toast(`Tag diterapkan ke ${hit} menu` + (miss.length ? ` · tidak ditemukan: ${miss.join(", ")}` : ""), true);
}
$("#fileIn").addEventListener("change", e => {

  r.onload = () => { try { const d = JSON.parse(r.result);
      if (d && d.kalyTagPatch){ applyTagPatch(d); return; }
      if (!d.categories) throw 0; snapshot(); state = normalize(d); save(true); renderAll(); toast("Backup dipulihkan", true); }
    catch(err){ toast("File backup tidak valid"); } };
  r.readAsText(f); e.target.value = "";
});

/* ===================== SLIDESHOW (tab 2) ===================== */
const BUCKET = "kaly-media";
const SL_KEY = "kaly-slides-admin-cache", SL_SCREEN_KEY = "kaly-slides-admin-screen", TAB_KEY = "kaly-admin-tab";
const MAX_VIDEO = 50 * 1024 * 1024;
let slides = normSlides((() => { try { return JSON.parse(lsGet(SL_KEY)); } catch(e){ return null; } })());
let slTs = null, slDirty = false, slSaving = false, slTimer = null, slLoaded = false, slSetupMissing = false, slBusy = 0;
let slScreenId = lsGet(SL_SCREEN_KEY) || "";
let tab = "menu";

function normSlides(d){
  d = d && typeof d === "object" ? d : {};
  d.screens = (Array.isArray(d.screens) ? d.screens : []).map(s => ({
    id: String(s.id || uid()), name: String(s.name || "Layar"),
    defaultSec: Math.min(600, Math.max(2, Math.round(+s.defaultSec || 8))),
    fit: s.fit === "contain" ? "contain" : "cover", transition: s.transition === "cut" ? "cut" : "fade",
    items: (Array.isArray(s.items) ? s.items : []).filter(it => it && it.path).map(it => ({
      id: String(it.id || uid()), type: it.type === "video" ? "video" : "image", path: String(it.path), name: String(it.name || ""),
      sec: +it.sec > 0 ? Math.min(3600, Math.round(+it.sec)) : 0, on: it.on !== false, dur: +it.dur || 0 })) }));
  if (!d.screens.length) d.screens.push({ id: "tv2", name: "TV 2", defaultSec: 8, fit: "cover", transition: "fade", items: [] });
  return d;
}
function curScreen(){
  let s = slides.screens.find(x => x.id === slScreenId);
  if (!s){ s = slides.screens[0]; slScreenId = s.id; }
  return s;
}
const slUrl = id => location.origin + "/slide/?layar=" + encodeURIComponent(id);
const pubUrl = path => SUPA_URL + "/storage/v1/object/public/" + BUCKET + "/" + path.split("/").map(encodeURIComponent).join("/");
const fmtDur = s => { s = Math.round(s || 0); return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0"); };
const authHeaders = () => Object.assign({ apikey: SUPA_KEY }, /^eyJ/.test(SUPA_KEY) ? { Authorization: "Bearer " + SUPA_KEY } : {});

/* ---- save / load ---- */
function slSave(now){
  lsSet(SL_KEY, JSON.stringify(slides));
  slDirty = true; setStatus("pending");
  clearTimeout(slTimer); slTimer = setTimeout(slFlush, now ? 0 : 600);
  pushPreview(false);
}
async function slFlush(){
  if (!pin || !started || !slLoaded) return;
  if (slSaving){ clearTimeout(slTimer); slTimer = setTimeout(slFlush, 300); return; }
  if (!slDirty) return;
  slSaving = true; slDirty = false;
  try {
    const ts = await rpc("kaly_slides_save", { p_pin: pin, p_data: slides });
    if (ts === null){ slDirty = true; slSaving = false; lock("PIN sudah diganti. Masukkan PIN yang baru."); return; }
    slTs = ts; if (slSetupMissing){ slSetupMissing = false; renderSlides(); }
    setStatus(slDirty ? "pending" : "ok");
  } catch(e){
    slDirty = true; setStatus(navigator.onLine === false ? "off" : "err");
    if (e.code === "LOCKED"){ slSaving = false; lock("Terlalu banyak PIN salah. Coba lagi 10 menit lagi."); return; }
    if (e.pg === "PGRST202" && !slSetupMissing){ slSetupMissing = true; renderSlides(); }
    clearTimeout(slTimer); slTimer = setTimeout(slFlush, slSetupMissing ? 30000 : 5000);
  }
  slSaving = false;
  if (slDirty){ clearTimeout(slTimer); slTimer = setTimeout(slFlush, 600); }
}
async function slLoad(){
  try {
    const r = await api("/rest/v1/kaly_menu_state?id=eq.slides&select=data,updated_at");
    slLoaded = true;
    if (r && r[0]){ slides = normSlides(r[0].data); slTs = r[0].updated_at; lsSet(SL_KEY, JSON.stringify(slides)); }
    else slSave(true);
  } catch(e){ slLoaded = true; }
  if (slDirty) slFlush();
  renderSlides();
}
async function slPull(){
  if (!started || !slLoaded || slDirty || slSaving || slBusy) return;
  if (document.activeElement && document.activeElement.closest && document.activeElement.closest("#slPanel")) return;
  try {
    const r = await api("/rest/v1/kaly_menu_state?id=eq.slides&select=updated_at");
    const ts = r && r[0] ? r[0].updated_at : null;
    if (!ts || ts === slTs) return;
    const r2 = await api("/rest/v1/kaly_menu_state?id=eq.slides&select=data,updated_at");
    if (!r2 || !r2[0] || slDirty || slSaving) return;
    slides = normSlides(r2[0].data); slTs = r2[0].updated_at; lsSet(SL_KEY, JSON.stringify(slides));
    renderSlides(); pushPreview(false);
  } catch(e){}
}

          <em>${it.sec ? "" : vid ? "· sampai video selesai" : "· ikut durasi default"}</em></div></div>
      <div class="sl-tools"><button class="sw" role="switch" aria-checked="${it.on}" data-sact="toggle" title="Tampilkan / sembunyikan di TV"><span class="track"></span><span class="knob"></span></button>
        <div class="mv"><button class="ib" data-sact="up" title="Naikkan"${i === 0 ? " disabled" : ""}>${I.up}</button><button class="ib" data-sact="down" title="Turunkan"${i === items.length - 1 ? " disabled" : ""}>${I.down}</button></div>
        <button class="ib del" data-sact="del" title="Hapus slide">${I.trash}</button></div></div>`;
  });
  P.innerHTML = h;
  updateFrame();
}

/* ---- media helpers ---- */
async function getTicket(){
  const t = await rpc("kaly_media_ticket", { p_pin: pin });
  if (!t){ lock("PIN sudah diganti. Masukkan PIN yang baru."); throw new Error("PIN"); }
  return t;
}
function uploadBlob(path, blob, type, onp){
  return new Promise((res, rej) => {
    const x = new XMLHttpRequest();
    x.open("POST", SUPA_URL + "/storage/v1/object/" + BUCKET + "/" + path, true);
    const hd = authHeaders(); Object.keys(hd).forEach(k => x.setRequestHeader(k, hd[k]));
    x.setRequestHeader("Content-Type", type);
    x.setRequestHeader("cache-control", "max-age=31536000");
    x.setRequestHeader("x-upsert", "false");
    if (x.upload) x.upload.onprogress = e => { if (e.lengthComputable) onp(e.loaded / e.total); };
    x.onload = () => (x.status >= 200 && x.status < 300) ? res() : rej(new Error(x.status + " " + String(x.responseText).slice(0, 200)));
    x.onerror = () => rej(new Error("network"));
    x.send(blob);
  });
}
async function shrinkImage(file){
  if (file.type === "image/gif") return { blob: file, type: file.type };
  const url = URL.createObjectURL(file);
  try {
    const img = await new Promise((res, rej) => { const im = new Image(); im.onload = () => res(im); im.onerror = rej; im.src = url; });
    const w = img.naturalWidth, h = img.naturalHeight;
    const k = Math.min(1, Math.max(1920 / w, 1080 / h));       /* just enough pixels to fill a Full-HD TV */
    if (k >= 1 && file.size < 1.5e6 && /jpeg|png|webp/.test(file.type)) return { blob: file, type: file.type };
    const c = document.createElement("canvas"); c.width = Math.round(w * k); c.height = Math.round(h * k);
    c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
    const type = file.type === "image/png" ? "image/png" : "image/jpeg";
    const blob = await new Promise(r => c.toBlob(r, type, 0.88));
    return blob ? { blob, type } : { blob: file, type: file.type || "image/jpeg" };
  } finally { URL.revokeObjectURL(url); }
}
function videoDuration(file){
  return new Promise(res => {
    const url = URL.createObjectURL(file), v = document.createElement("video");
    const done = d => { URL.revokeObjectURL(url); res(isFinite(d) ? Math.round(d) : 0); };
    v.preload = "metadata"; v.muted = true; v.onloadedmetadata = () => done(v.duration); v.onerror = () => done(0);
    setTimeout(() => done(0), 8000); v.src = url;
  });
}
async function deleteMedia(paths){
  paths = paths.filter(p => !slides.screens.some(s => s.items.some(i => i.path === p)));
  if (!paths.length) return;
  try {
    const ok = await rpc("kaly_media_allow_delete", { p_pin: pin, p_paths: paths });
    if (!ok) return;
    await fetch(SUPA_URL + "/storage/v1/object/" + BUCKET, { method: "DELETE", headers: Object.assign({ "Content-Type": "application/json" }, authHeaders()), body: JSON.stringify({ prefixes: paths }) });
  } catch(e){ /* file stays in storage; harmless */ }
}
async function uploadFiles(files){
  files = Array.from(files || []); if (!files.length) return;
  if (slSetupMissing){ toast("Jalankan kaly-slideshow-setup.sql di Supabase dulu"); return; }
  const sc = curScreen(), prog = $("#slProg");
  let token;
  slBusy++;
  try { token = await getTicket(); }
  catch(e){ slBusy--; if (e.pg === "PGRST202"){ slSetupMissing = true; renderSlides(); } else if (e.message !== "PIN") toast("Gagal mulai upload — cek internet"); return; }
  let added = 0;
  for (const f of files){
    const isVid = /^video\//.test(f.type), isImg = /^image\//.test(f.type);
    const row = document.createElement("div"); row.className = "sl-prog";
    row.innerHTML = `<span>${esc(f.name)}</span><div class="bar"><i></i></div>`; if (prog) prog.appendChild(row);
    const setP = p => { row.querySelector("i").style.width = Math.round(p * 100) + "%"; };
    const fail = msg => { row.classList.add("bad"); row.querySelector("span").textContent = f.name + " — " + msg; };
    if (!isVid && !isImg){ fail("bukan gambar/video"); continue; }
    if (isVid && f.size > MAX_VIDEO){ fail("lebih dari 50 MB, kompres dulu"); continue; }
    try {
      let blob = f, type = f.type, dur = 0;
      if (isImg) ({ blob, type } = await shrinkImage(f)); else dur = await videoDuration(f);
      const ext = ({ "image/jpeg":"jpg", "image/png":"png", "image/webp":"webp", "image/gif":"gif", "video/mp4":"mp4", "video/webm":"webm", "video/quicktime":"mov" })[type] || "bin";
      const path = `${token}/${Date.now().toString(36)}-${uid()}.${ext}`;
      await uploadBlob(path, blob, type, setP);
      sc.items.push({ id: uid(), type: isVid ? "video" : "image", path, name: f.name.replace(/\.[^.]+$/, "").slice(0, 60), sec: 0, on: true, dur });
      added++; setP(1); row.classList.add("ok"); slSave(true);
      if (type === "video/quicktime") toast("Video .mov tersimpan — kalau tidak tampil di TV, ekspor ulang ke MP4");
    } catch(e){ fail(/413|too large|exceed|Payload/i.test(e.message) ? "file terlalu besar" : "gagal upload"); }
  }
  slBusy--;
  renderSlides();
  if (added) toast(`${added} slide ditambahkan ke ${sc.name}`);
}

/* ---- events ---- */
$("#slPanel").addEventListener("click", e => {
  const b = e.target.closest("[data-sact]"); if (!b) return;
  e.preventDefault();
  const sc = curScreen(), row = b.closest(".sl-it"), it = row ? sc.items.find(x => x.id === row.dataset.id) : null;
  const idx = it ? sc.items.indexOf(it) : -1;
  switch (b.dataset.sact){
    case "screen-add": {
      let n = slides.screens.length + 2, id; do { id = "tv" + n++; } while (slides.screens.some(s => s.id === id));
      const s = { id, name: "TV " + (n - 1), defaultSec: sc.defaultSec, fit: "cover", transition: "fade", items: [] };
      slides.screens.push(s); slScreenId = s.id; lsSet(SL_SCREEN_KEY, s.id); slSave(true); renderSlides();
      const inp = $("#slName"); if (inp){ inp.focus(); inp.select(); } break;
    }
    case "screen-del":
      confirmBox("Hapus layar?", `Layar "${sc.name}" dan ${sc.items.length} slide-nya akan dihapus. TV yang memakai link layar ini akan menampilkan pilihan layar.`).then(ok => {
        if (!ok) return; const paths = sc.items.map(i => i.path);
        slides.screens = slides.screens.filter(s => s !== sc); slScreenId = slides.screens[0].id; lsSet(SL_SCREEN_KEY, slScreenId);
        slSave(true); renderSlides(); deleteMedia(paths); toast("Layar dihapus");
      }); break;
    case "copy": {
      const u = slUrl(sc.id);
      (navigator.clipboard ? navigator.clipboard.writeText(u) : Promise.reject()).then(() => toast("Link disalin"), () => toast(u)); break;
    }
    case "open": window.open(slUrl(sc.id), "_blank"); break;
    case "toggle": if (it){ it.on = !it.on; slSave(); renderSlides(); } break;
    case "up": case "down": {
      const j = idx + (b.dataset.sact === "up" ? -1 : 1); if (!it || j < 0 || j >= sc.items.length) break;
      [sc.items[idx], sc.items[j]] = [sc.items[j], sc.items[idx]]; slSave(); renderSlides(); break;
    }
    case "del":
      if (!it) break;
      confirmBox("Hapus slide?", `"${it.name || "Slide " + (idx + 1)}" akan dihapus dari ${sc.name} dan file-nya dihapus dari penyimpanan.`).then(ok => {
        if (!ok) return; sc.items = sc.items.filter(x => x !== it); slSave(true); renderSlides(); deleteMedia([it.path]); toast("Slide dihapus");
      }); break;
  }
});
$("#slPanel").addEventListener("change", e => {
  const t = e.target, sc = curScreen();
  if (t.id === "slScreen"){ slScreenId = t.value; lsSet(SL_SCREEN_KEY, slScreenId); renderSlides(); return; }
  if (t.id === "slFile"){ uploadFiles(t.files); t.value = ""; return; }
  if (t.id === "slDef"){ sc.defaultSec = Math.min(600, Math.max(2, Math.round(+t.value || 8))); slSave(); renderSlides(); pushPreview(true); return; }
  if (t.id === "slTrans"){ sc.transition = t.value === "cut" ? "cut" : "fade"; slSave(); return; }
  if (t.id === "slFit"){ sc.fit = t.value === "contain" ? "contain" : "cover"; slSave(); return; }
  if (t.dataset.sfield === "sec"){
    const it = sc.items.find(x => x.id === t.closest(".sl-it").dataset.id); if (!it) return;
    it.sec = +t.value > 0 ? Math.min(3600, Math.round(+t.value)) : 0; slSave(); renderSlides(); return;
  }
});
$("#slPanel").addEventListener("input", e => {
  const t = e.target, sc = curScreen();
  if (t.id === "slName"){ sc.name = t.value; const o = $("#slScreen").selectedOptions[0]; if (o) o.textContent = `${t.value} · ${sc.items.length} slide`; slSave(); return; }
  if (t.dataset.sfield === "name"){ const it = sc.items.find(x => x.id === t.closest(".sl-it").dataset.id); if (it){ it.name = t.value; slSave(); } }
});
["dragenter", "dragover"].forEach(ev => $("#slPanel").addEventListener(ev, e => { const d = e.target.closest && e.target.closest("#slDrop"); if (d){ e.preventDefault(); d.classList.add("over"); } }));
["dragleave", "drop"].forEach(ev => $("#slPanel").addEventListener(ev, e => { const d = e.target.closest && e.target.closest("#slDrop"); if (d){ e.preventDefault(); d.classList.remove("over"); if (ev === "drop") uploadFiles(e.dataTransfer.files); } }));
$("#slFrame").addEventListener("load", () => pushPreview(true));

/* ---- tabs ---- */
function setTab(t){
  tab = t === "slides" ? "slides" : "menu"; lsSet(TAB_KEY, tab);
  document.body.classList.toggle("tab-slides", tab === "slides");
  document.querySelectorAll("#tabs button").forEach(b => b.classList.toggle("on", b.dataset.tab === tab));
  if (tab === "slides") renderSlides(); else requestAnimationFrame(scaleStage);
}
$("#tabs").addEventListener("click", e => { const b = e.target.closest("button[data-tab]"); if (b) setTab(b.dataset.tab); });

/* ---------- PIN gate ---------- */
let entry = "";
const PIN_MAX = 12;
function drawDots(){ const n = Math.max(6, entry.length); $("#dots").innerHTML = Array.from({length:n}, (_, i) => `<i class="${i < entry.length ? "on" : ""}"></i>`).join(""); }
function lock(msg){
  started = false; entry = ""; drawDots();
  $("#gateMsg").textContent = msg || "";
  $("#gate").classList.remove("hidden");
}
async function tryPin(){
  if (!entry) return;
  if (!/^https:/.test(SUPA_URL)){ $("#gateMsg").textContent = "Database belum disambungkan — isi file config.js lalu deploy ulang."; return; }
  $("#gateMsg").textContent = "Memeriksa…";
  try {
    const ok = await rpc("kaly_menu_check", { p_pin: entry });
    if (!ok){ $("#gateMsg").textContent = "PIN salah"; $("#gateCard").classList.remove("shake"); void $("#gateCard").offsetWidth; $("#gateCard").classList.add("shake"); entry = ""; drawDots(); return; }
    pin = entry; lsSet(PINKEY, pin);
    $("#gate").classList.add("hidden");
    start();
  } catch(e){
    $("#gateMsg").textContent = e.code === "LOCKED" ? "Terlalu banyak PIN salah. Coba lagi 10 menit lagi." : "Tidak bisa terhubung. Cek internet iPad.";
    entry = ""; drawDots();
  }
}
$("#keys").addEventListener("click", e => {
  const b = e.target.closest("button[data-k]"); if (!b) return;
  const k = b.dataset.k;
  if (k === "del") entry = entry.slice(0, -1);
  else if (k === "ok") return tryPin();
  else if (entry.length < PIN_MAX) entry += k;
  $("#gateMsg").textContent = ""; drawDots();
});
document.addEventListener("keydown", e => {
  if ($("#gate").classList.contains("hidden")) return;
  if (/^[0-9]$/.test(e.key) && entry.length < PIN_MAX){ entry += e.key; drawDots(); }
  else if (e.key === "Backspace"){ entry = entry.slice(0, -1); drawDots(); }
  else if (e.key === "Enter") tryPin();
});

/* change PIN */
function openPinModal(){ $("#pinNew").value = $("#pinNew2").value = ""; $("#pinErr").textContent = ""; $("#pinModal").classList.add("open"); setTimeout(() => $("#pinNew").focus(), 50); }
$("#pinCancel").onclick = () => $("#pinModal").classList.remove("open");
$("#pinForm").addEventListener("submit", async e => {
  e.preventDefault();
  const a = $("#pinNew").value.trim(), b = $("#pinNew2").value.trim();
  if (!/^[0-9]{4,12}$/.test(a)){ $("#pinErr").textContent = "PIN harus 4–12 angka."; return; }
  if (a !== b){ $("#pinErr").textContent = "Kedua PIN tidak sama."; return; }
  try {
    const ok = await rpc("kaly_menu_change_pin", { p_old: pin, p_new: a });
    if (!ok){ $("#pinModal").classList.remove("open"); lock("PIN lama sudah tidak berlaku. Masukkan PIN terbaru."); return; }
    pin = a; lsSet(PINKEY, pin); $("#pinModal").classList.remove("open"); toast("PIN admin berhasil diganti");
  } catch(err){ $("#pinErr").textContent = "Gagal: cek koneksi internet."; }
});

/* start after unlock */
let pollT = null;
async function start(){
  started = true; setStatus("load");
  try {
    const row = await fetchRow();
    if (row){ checkVersion(row.data); state = normalize(row.data); remoteTs = row.updated_at; base = JSON.stringify(state); lsSet(KEY, JSON.stringify(state)); undoStack = []; updUndo(); renderAll(); setStatus("ok"); if (state._migrated){ delete state._migrated; save(true); } }
    else { save(true); }
  } catch(e){ base = JSON.stringify(state); setStatus("off"); toast("Tidak bisa terhubung ke server — perubahan disimpan & dikirim saat online"); }
  if (dirty) flush();
  clearInterval(pollT); pollT = setInterval(() => { pullRemote(); slPull(); }, 5000);
  slLoad();
}

setMode("edit", false);
setTab(lsGet(TAB_KEY) || "menu");
(document.fonts && document.fonts.ready ? document.fonts.ready : Promise.resolve()).then(() => scaleStage());
if (pin){ $("#gate").classList.add("hidden"); start(); } else { lock(""); }
})();
</script>
