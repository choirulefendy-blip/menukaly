function fetchBlob(path, cb){
  if (blobs[path]) return cb && cb(blobs[path]);
  if (cachedBytes > MAX_CACHE_BYTES || !window.URL || !URL.createObjectURL) return cb && cb(null);
  if (loading[path]){ if (cb) loading[path].push(cb); return; }
  loading[path] = cb ? [cb] : [];
  var x = new XMLHttpRequest();
  x.open("GET", publicUrl(path), true);
  x.responseType = "blob";
  x.onload = function(){
    var url = null;
    if (x.status >= 200 && x.status < 300 && x.response){ url = URL.createObjectURL(x.response); blobs[path] = url; cachedBytes += x.response.size || 0; }
    var cbs = loading[path]; delete loading[path];
    for (var i = 0; i < cbs.length; i++) cbs[i](url);
  };
  x.onerror = x.ontimeout = function(){ var cbs = loading[path]; delete loading[path]; for (var i = 0; i < cbs.length; i++) cbs[i](null); };
  x.send();
}
function dropUnused(){
  var keep = {};
  if (data && data.screens) for (var s = 0; s < data.screens.length; s++){ var its = data.screens[s].items || []; for (var i = 0; i < its.length; i++) keep[its[i].path] = 1; }
  for (var p in blobs) if (blobs.hasOwnProperty(p) && !keep[p]){ try { URL.revokeObjectURL(blobs[p]); } catch(e){} delete blobs[p]; }
}

/* ---------- player ---------- */
function secOf(it){
  if (it.type === "video") return +it.sec > 0 ? +it.sec : 0;   /* 0 = play to the end */
  return +it.sec > 0 ? +it.sec : (+screen.defaultSec || 8);
}
function stop(){ clearTimeout(timer); timer = null; }
function next(){
  stop();
  if (!list.length){ showEmpty(); return; }
  idx = (idx + 1) % list.length;
  play(list[idx], idx);
}
function play(it, myIdx){
  waiting = true;
  ensure(it, function(url){
    waiting = false;
    if (myIdx !== idx) return;                                /* superseded meanwhile */
    var L = layers[1 - cur]; L.innerHTML = "";
    var single = list.length === 1;
    if (it.type === "video"){
      var v = document.createElement("video");
      v.muted = true; v.setAttribute("muted", ""); v.setAttribute("playsinline", ""); v.setAttribute("webkit-playsinline", "");
      v.autoplay = true; v.preload = "auto"; if (single) v.loop = true;
      var started = false;
      var go = function(){
        if (started) return; started = true; reveal(L);
        try { var p = v.play(); if (p && p["catch"]) p["catch"](function(){}); } catch(e){}
        if (single) return;
        var s = secOf(it);
        if (s > 0) timer = setTimeout(next, s * 1000);
        else { v.onended = function(){ next(); }; timer = setTimeout(next, Math.max(15, (isFinite(v.duration) ? v.duration : 120) + 5) * 1000); }
      };
      v.oncanplay = go; v.onloadeddata = go;
      v.onerror = function(){ if (!started){ started = true; timer = setTimeout(next, 800); } };
      v.src = url; L.appendChild(v);
      setTimeout(function(){ if (!started && myIdx === idx) go(); }, 6000);
    } else {
      var img = new Image();
      img.onload = function(){ if (myIdx !== idx) return; L.innerHTML = ""; L.appendChild(img); reveal(L); if (!single) timer = setTimeout(next, secOf(it) * 1000); };
      img.onerror = function(){ timer = setTimeout(next, 800); };
      img.alt = ""; img.src = url;
    }
    if (list.length > 1) fetchBlob(list[(idx + 1) % list.length].path);   /* warm up the next slide */
  });
}
function reveal(L){
  show("empty", false); show("pick", false);
  var old = layers[cur];
  setClass(L, "on", true); setClass(old, "on", false);
  cur = 1 - cur;
  setTimeout(function(){
    if (hasClass(old, "on")) return;
    var vs = old.getElementsByTagName("video"); for (var i = 0; i < vs.length; i++){ try { vs[i].pause(); } catch(e){} }
    old.innerHTML = "";
  }, 1000);
}
function showEmpty(){
  stop(); idx = -1; playingSig = "";
  setClass(layers[0], "on", false); setClass(layers[1], "on", false);
  layers[0].innerHTML = layers[1].innerHTML = "";
  document.getElementById("emptyMsg").innerHTML = screen ? "Belum ada slide untuk <b>" + esc(screen.name) + "</b>." : "Belum ada slide.";
  show("pick", false); show("empty", true);
}
function showPicker(){
  stop(); idx = -1; playingSig = "";
  var h = "", sc = (data && data.screens) || [];
  for (var i = 0; i < sc.length; i++) h += '<button type="button" data-id="' + esc(sc[i].id) + '">' + esc(sc[i].name) + "</button>";
  document.getElementById("pickList").innerHTML = h || "<p>Belum ada layar. Buat dulu di admin → Slideshow.</p>";
  show("empty", false); show("pick", true);
  var first = document.querySelector("#pickList button"); if (first) try { first.focus(); } catch(e){}
}
document.getElementById("pickList").onclick = function(e){
  var b = e.target; while (b && b.tagName !== "BUTTON") b = b.parentNode;
  if (!b) return;
  lsSet(SCREEN_KEY, b.getAttribute("data-id"));
  apply(data, true);
};

function wantedScreenId(){ return qs("layar") || lsGet(SCREEN_KEY) || ""; }
function apply(d, force){
  data = d || { screens: [] };
  var sc = data.screens || [], want = wantedScreenId();
  screen = null;
  for (var i = 0; i < sc.length; i++) if (sc[i].id === want) screen = sc[i];
  if (!screen && sc.length === 1 && !qs("layar")) screen = sc[0];
  if (!screen){ showPicker(); return; }
  setClass(document.body, "contain", screen.fit === "contain");
  setClass(document.body, "cut", screen.transition === "cut");
  var items = screen.items || [];
  list = [];
  for (var j = 0; j < items.length; j++) if (items[j].on !== false && items[j].path) list.push(items[j]);
  dropUnused();
  var sig = JSON.stringify(list);
  if (!list.length){ showEmpty(); return; }
  if (force || sig !== playingSig || idx === -1){
    var wasEmpty = idx === -1;
    playingSig = sig;
    if (wasEmpty || force){ idx = -1; next(); }
    else if (idx >= list.length || (!timer && !waiting)){ idx = -1; next(); }
    /* otherwise: keep the current slide; the new list takes over at the next transition */
  }
}

/* ---------- network ---------- */
function get(path, cb){
  var x = new XMLHttpRequest();
  x.open("GET", SUPA_URL + path + "&id=neq.t" + Date.now(), true);
  x.setRequestHeader("apikey", SUPA_KEY);
  x.timeout = 10000;
  x.onreadystatechange = function(){
    if (x.readyState !== 4) return;
    if (x.status >= 200 && x.status < 300){ var j = null; try { j = JSON.parse(x.responseText); } catch(e){} cb(null, j); }
    else cb(new Error("HTTP " + x.status));
  };
  x.ontimeout = function(){ cb(new Error("timeout")); };
  x.send();
}
function online(ok){ fails = ok ? 0 : fails + 1; document.getElementById("net").style.display = fails >= 5 ? "block" : "none"; }
function poll(){
  if (!/^https?:/.test(SUPA_URL)) return;
  get("/rest/v1/kaly_menu_state?id=eq.slides&select=updated_at", function(err, rows){
    if (err){ online(false); return; }
    online(true);
    var ts = rows && rows[0] ? rows[0].updated_at : null;
    if (!ts){ if (lastTs === null){ lastTs = "none"; apply({ screens: [] }); } return; }
    if (ts === lastTs) return;
    get("/rest/v1/kaly_menu_state?id=eq.slides&select=data,updated_at", function(err2, rows2){
      if (err2 || !rows2 || !rows2[0]) return;
      lastTs = rows2[0].updated_at;
      lsSet(CACHE_KEY, JSON.stringify(rows2[0].data));
      apply(rows2[0].data, false);
    });
  });
}
/* instant preview from the admin page (same origin) */
window.addEventListener("message", function(e){
  if (e.origin !== location.origin || !e.data || e.data.type !== "kaly-slides") return;
  apply(e.data.data, !!e.data.restart);
});

/* ---------- fullscreen, idle cursor, keep awake ---------- */
function goFS(){
  var d = document.documentElement;
  var f = d.requestFullscreen || d.webkitRequestFullscreen || d.webkitRequestFullScreen || d.msRequestFullscreen;
  if (f){ try { var p = f.call(d); if (p && p["catch"]) p["catch"](function(){}); } catch(e){} }
}
function fsChange(){ setClass(document.body, "isfs", !!(document.fullscreenElement || document.webkitFullscreenElement)); }
document.getElementById("fs").onclick = goFS;
document.addEventListener("keydown", function(e){
  if (hasClass(document.getElementById("pick"), "show")) return;
  if (e.keyCode === 13 || e.key === "f" || e.key === "F") goFS();
});
document.addEventListener("fullscreenchange", fsChange);
document.addEventListener("webkitfullscreenchange", fsChange);
var idleT;
function wake(){ setClass(document.body, "idle", false); clearTimeout(idleT); idleT = setTimeout(function(){ setClass(document.body, "idle", true); }, 4000); }
document.addEventListener("mousemove", wake); document.addEventListener("keydown", wake); document.addEventListener("touchstart", wake);
function keepAwake(){ try { if (navigator.wakeLock && navigator.wakeLock.request) navigator.wakeLock.request("screen")["catch"](function(){}); } catch(e){} }
document.addEventListener("visibilitychange", function(){ if (document.visibilityState === "visible"){ keepAwake(); poll(); } });

/* ---------- boot ---------- */
if (PREVIEW) setClass(document.body, "preview", true);
var cached = null;
try { cached = JSON.parse(lsGet(CACHE_KEY)); } catch(e){}
if (cached && cached.screens) apply(cached, true); else showEmpty();
wake(); if (!PREVIEW) keepAwake();
poll();
setInterval(poll, POLL_MS);
/* refresh every 6 hours (only when online) to keep long-running TV browsers healthy */
if (!PREVIEW) setInterval(function(){
  if (Date.now() - BOOT > 6 * 60 * 60 * 1000 && fails === 0 && navigator.onLine !== false) location.reload();
}, 60 * 1000);
})();
</script>
